# Agentic v1 recipe — the Gate 2 editing surface.
# Edit domains, personas, complexity mix here.
name: agentic_v1
target_count: 10000
max_turns: 12
pass_threshold: 4          # all judge dimensions >= this

domains:
  # Original 8 domains (~0.47 total)
  railway_booking: { weight: 0.07, tool_count_range: [3, 3] }
  mobile_finance: { weight: 0.08, tool_count_range: [3, 3] }
  healthcare: { weight: 0.06, tool_count_range: [3, 3] }
  ecommerce: { weight: 0.07, tool_count_range: [3, 3] }
  govt_services: { weight: 0.04, tool_count_range: [1, 1] }
  agri_weather: { weight: 0.05, tool_count_range: [2, 2] }
  news: { weight: 0.04, tool_count_range: [1, 1] }
  telecom: { weight: 0.06, tool_count_range: [2, 2] }
  # New 10 BD-focused domains (~0.53 total) — slightly emphasized as the novel contribution
  sports_scores: { weight: 0.07, tool_count_range: [4, 4] }
  food_delivery: { weight: 0.06, tool_count_range: [4, 4] }
  travel_planning: { weight: 0.06, tool_count_range: [4, 4] }
  education: { weight: 0.05, tool_count_range: [4, 4] }
  bus_launch_booking: { weight: 0.05, tool_count_range: [4, 4] }
  flight_booking: { weight: 0.04, tool_count_range: [3, 3] }
  real_estate: { weight: 0.04, tool_count_range: [3, 3] }
  job_search: { weight: 0.05, tool_count_range: [4, 4] }
  movie_cinema: { weight: 0.04, tool_count_range: [3, 3] }
  city_transport: { weight: 0.07, tool_count_range: [3, 3] }

goal_complexity_mix:
  single_shot: 0.30
  multi_step: 0.50
  needs_clarification: 0.15
  multi_intent: 0.05

persona_axes:
  age_range: [18, 70]
  locations: [urban, rural]
  regions: [bangladesh]
  registers: [tui, tumi, apni]
  tech_literacy: [low, medium, high]
  # New variation axes — weighted dicts give ~25% banglish, ~60% english sysprompt
  scripts: { bengali: 0.75, banglish: 0.25 }
  system_prompt_languages: { english: 0.6, bangla: 0.4 }
  professions: [ছাত্র, চাকরিজীবী, কৃষক, ব্যবসায়ী, গৃহিণী, শিক্ষক, প্রকৌশলী, দোকানদার, চালক, কৃষিবিদ, নার্স, ডাক্তার, সাংবাদিক, ক্রীড়াবিদ]

goal_templates:
  railway_booking:
    # Formal (apni-style, complete info)
    - "আমি ঢাকা থেকে চট্টগ্রাম আগামী শুক্রবারের ট্রেন খুঁজছি, তারিখ ২০২৬-০৭-২০। ভাড়াও জানতে চাই।"
    - "ঢাকা থেকে সিলেট ২০২৬-০৭-২৫ তারিখের ট্রেনগুলো দেখান।"
    - "চট্টগ্রাম থেকে ঢাকা, তারিখ ২০২৬-০৮-০১, ৩টি সিট বুক করতে চাই। নাম করিম আহমেদ।"
    - "রাজশাহী থেকে ঢাকা, আগামী শনিবার (২০২৬-০৭-২৬) কোন ট্রেন আছে?"
    - "খুলনা থেকে রাজশাহী, তারিখ ২০২৬-০৯-১০, স্নিগ্ধা ক্লাসে ভাড়া কত?"
    - "ময়মনসিংহ থেকে ঢাকা, ২০২৬-০৮-১৫, দুজনের টিকিট দরকার। নাম সালমা আক্তার।"
    # Semi-formal
    - "ভাই, ঢাকা থেকে চট্টগ্রাম আগামী সোমবার (২০২৬-০৭-২১) ট্রেন আছে? ভাড়া কত হবে?"
    - "স্যার, সিলেট এক্সপ্রেসে আগামী বুধবারের এসি সিট দরকার, তারিখ ২০২৬-০৭-২৩।"
    - "ঢাকা-যশোর রুটে ২০২৬-০৮-০৫ তারিখে কী কী ট্রেন চলে জানাবেন?"
    # Informal (tumi-style, short)
    - "এই যে, ঢাকা থেকে চট্টগ্রাম কালকার ট্রেন দেখাও তো। তারিখ ২০২৬-০৭-১৫।"
    - "সিলেট যামু, আগামীকাল (২০২৬-০৭-১৬)। ট্রেন ধরায় দেখাও।"
    - "রাজশাহী থেকে ঢাকা, শুক্রবার (২০২৬-০৭-১৮), ভাড়া কত?"
    - "ট্রেনে ২ জনের টিকিট লাগবে, খুলনা থেকে ঢাকা, তারিখ ২০২৬-০৭-২২।"

  mobile_finance:
    # Formal
    - "আমার একাউন্টে এখন কত টাকা আছে দেখান।"
    - "আমার বন্ধুর নম্বর ০১৭১২৩৪৫৬৭৮-এ ৫০০ টাকা পাঠাতে চাই।"
    - "আমার বিদ্যুৎ বিল পরিশোধ করতে চাই — একাউন্ট নম্বর ৮৮০১২৩৪৫৬৭৮, পরিমাণ ১২০০ টাকা।"
    - "গ্যাস বিল দিতে চাই, একাউন্ট ৯৯০০৯৯১১২২, পরিমাণ ৮৫০ টাকা।"
    - "পানির বিল পরিশোধ করুন, একাউন্ট ৪৪৫৫৬৬৭৭৮৮, পরিমাণ ৩২০ টাকা।"
    - "ইন্টারনেট বিল দিতে চাই, একাউন্ট ৭৭১১২২৩৩৪, পরিমাণ ১০০০ টাকা।"
    - "নম্বর ০১৮১১২২৩৩৪৪-এ ২০০০ টাকা পাঠান।"
    # Semi-formal
    - "ভাই, একাউন্টে কত টাকা আছে একটু দেখাবেন?"
    - "বিদ্যুৎ বিল দিতে হবে, একাউন্ট ১১২২৩৩৪৪৫৫, টাকা ১৫০০। করে দিন।"
    - "বন্ধুর নম্বর ০১৯৯৮৮৭৭৬৬৫৫-এ ১০০০ টাকা পাঠাতে চাই।"
    - "গ্যাস বিল, একাউন্ট নম্বর ৬৬৭৭৮৮৯৯০০, পরিমাণ ৬৫০ টাকা দিয়ে দিন।"
    # Informal
    - "ব্যালেন্স কত আছে দেখাও তো।"
    - "এই নম্বরে ০১৬১২৩৪৫৬৭৮ পাঁচশ টাকা পাঠিয়ে দে।"
    - "টিভি বিল দে, একাউন্ট ৩৩৪৪৫৫৬৬৭৭, ৪০০ টাকা।"
    - "কত টাকা আছে ব্যালেন্সে বল দেখি।"

  healthcare:
    # Formal
    - "ঢাকায় একজন হৃদরোগ বিশেষজ্ঞ খুঁজছি, অ্যাপয়েন্টমেন্ট নিতে চাই।"
    - "ডাক্তার DR-001-এর ২০২৬-০৭-২০ তারিখের ফাঁকা স্লটগুলো দেখান।"
    - "চট্টগ্রামে শিশু বিশেষজ্ঞ দেখাতে চাই, সন্তানের নাম সাবিহা।"
    - "DR-002 এর স্লট S1 এ আমার নাম ফাতেমা বেগম বুক করুন।"
    - "গাইনি বিশেষজ্ঞ লাগবে ঢাকায়, নাম রিনা সেনগুপ্ত বুক করুন।"
    - "DR-001-এর আগামীকালের স্লটগুলো দেখান, তারিখ ২০২৬-০৭-১৬।"
    # Semi-formal
    - "ভাইয়া, চামড়ার ডাক্তার আছেন ঢাকায়? নাম বুক করতে চাই।"
    - "ডাক্তার DR-003 এর আজকের কোনো সময় ফাঁকা আছে?"
    - "শিশু ডাক্তার লাগবে, আমার মেয়ের নাম নুসরাত। চট্টগ্রামে চাই।"
    # Informal
    - "চোখের ডাক্তার দেখাও তো কোথায় আছে।"
    - "DR-001 এর স্লট S0 তে আমার নাম বুক করে দে, নাম রিয়াদ।"
    - "দাঁতের ডাক্তার লাগবে আজকের জন্য, নাম সাজ্জাদ।"
    - "ডাক্তার DR-002 এর সময় কখন ফাঁকা আছে দেখাও।"

  ecommerce:
    # Formal
    - "আমি একটি মোবাইল ফোন খুঁজছি, দাম ১০০০০ থেকে ১৫০০০ টাকার মধ্যে।"
    - "আমার অর্ডার ORD-৯৯১২৩৪৫ এর স্ট্যাটাস কী? কবে পাব?"
    - "অর্ডার ORD-৪৪৫৫৬৬৭-এর ফোনটি ত্রুটিপূর্ণ — স্পিকার কাজ করছে না, রিটার্ন চাই।"
    - "এলইডি টিভি খুঁজছি, বাজেট ৪০০০০-৫০০০০ টাকা।"
    - "রেফ্রিজারেটর দরকার, দাম ২০০০০-৩০০০০ টাকার মধ্যে দেখান।"
    - "অর্ডার ORD-৭৭৮৮৯৯০০ কোথায় এখন? ডেলিভারি কবে?"
    # Semi-formal
    - "ভাই, হেডফোন আছে? দাম ১০০০-২০০০ টাকার মধ্যে হবে।"
    - "আমার অর্ডার ORD-৩৩২২১১০ কবে আসবে বলবেন?"
    - "ওয়াশিং মেশিন দেখাও, বাজেট ১৫০০০-২০০০০।"
    - "অর্ডার ORD-৫৫৬৬৭৭৮৮ এর পণ্য নষ্ট, ফেরত দিতে চাই।"
    # Informal
    - "ব্লুটুথ স্পিকার দেখাও, ১০০০-৩০০০ টাকার মধ্যে।"
    - "অর্ডার ORD-১১২২৩৩ কোথায় রে এখন?"
    - "এসি লাগবে, দাম ৪০০০০-৬০০০০ এর মধ্যে দেখাও।"
    - "ফোনটা কাজ করছে না, অর্ডার ORD-৯৯৮৮৭৭৬৬, রিটার্ন করতে চাই।"

  govt_services:
    # Formal
    - "আমার পাসপোর্ট আবেদনের অবস্থা দেখান — আবেদন নম্বর PSG1234567।"
    - "জন্ম নিবন্ধন সনদ প্রস্তুত হয়েছে কি? আবেদন নম্বর BRT9988776।"
    - "আমার NID আবেদন ABC456789-এর স্ট্যাটাস জানান।"
    - "পাসপোর্ট রেডি হয়েছে কিনা দেখান, আইডি PSG998877।"
    # Semi-formal
    - "ভাই, পাসপোর্ট আবেদন PSG4455667 এর খবর কী?"
    - "জন্ম নিবন্ধন BRT5544332 রেডি হয়েছে?"
    - "NID আবেদন XYZ998877 — কোন স্টেজে আছে বলেন?"
    # Informal
    - "পাসপোর্ট PSG112233 হলো কি না দেখাও তো।"
    - "জন্ম নিবন্ধন BRT7766554 এর খবর দে দেখি।"

  agri_weather:
    # Formal
    - "ঢাকার আগামী ৭ দিনের আবহাওয়ার পূর্বাভাস দেখান।"
    - "রাজশাহী অঞ্চলে ধান চাষের পরামর্শ চাই।"
    - "সিলেটের আগামী ৫ দিনের আবহাওয়া কেমন হবে?"
    - "যশোর অঞ্চলে পাট চাষের উপদেশ দিন।"
    - "রংপুরের আগামীকালের আবহাওয়া জানান।"
    - "খুলনায় আগামী ৩ দিনের পূর্বাভাস দরকার।"
    # Semi-formal
    - "ভাই, ঢাকার আগামী সপ্তাহের আবহাওয়া কেমন থাকবে?"
    - "বরিশালে ধান চাষ করবো, পরামর্শ দেবেন?"
    - "ময়মনসিংহের আগামীকালের আবহাওয়া বলবেন?"
    # Informal
    - "কালকার আবহাওয়া দেখাও তো, ঢাকার।"
    - "রাজশাহীতে ধান লাগাবো, কেমন হবে বল?"
    - "সিলেটের এই সপ্তাহের আবহাওয়া দে দেখি।"
    - "যশোরে পাট কেমন হবে বল দে?"

  news:
    # Formal
    - "আজকের শীর্ষ খবরগুলো দেখান।"
    - "ক্রিকেট সংক্রান্ত সাম্প্রতিক খবর চাই।"
    - "গত সপ্তাহের রাজনৈতিক খবর দেখান।"
    - "বাংলাদেশের অর্থনীতি নিয়ে খবর চাই।"
    - "আজকের আবহাওয়া সংক্রান্ত খবর দেখান।"
    - "খেলাধুলার খবর চাই, বিশেষ করে ফুটবল।"
    # Semi-formal
    - "ভাই, আজকের প্রধান খবর কী কী?"
    - "ক্রিকেটে গতকাল কী হলো বলবেন?"
    - "অর্থনীতির খবর দেখান, এই সপ্তাহের।"
    # Informal
    - "আজকের খবর দে দেখি শিগগির।"
    - "ক্রিকেটে কী হলো কাল বল?"
    - "রাজনীতির কী খবর বল?"

  telecom:
    # Formal
    - "আমার নম্বর ০১৭১১২২৩৩৪৪-এ ১০০ টাকা রিচার্জ করুন, অপারেটর grameenphone।"
    - "নম্বর ০১৮২২৩৩৪৪৫৫-এ ৫ জিবির ৭ দিনের ইন্টারনেট প্যাক কিনতে চাই।"
    - "robi নম্বর ০১৮৯৯৮৮৭৭৬৬-এ ২০০ টাকা রিচার্জ করতে চাই।"
    - "banglalink নম্বর ০১৯১১২২৩৩৪৪-এ ১৫ জিবির মাসিক প্যাক দরকার।"
    - "teletalk নম্বর ০১৫১১২২৩৩৪৪-এ ৫০ টাকা রিচার্জ করুন।"
    - "grameenphone নম্বর ০১৭৯৯৮৮৭৭৬৬-এ ৫০ জিবির মাসিক প্যাক কিনুন।"
    # Semi-formal
    - "ভাই, নম্বর ০১৭২২৩৩৪৪৫৫-এ ৩০০ টাকা রিচার্জ করবো, grameenphone।"
    - "robi নম্বর ০১৮৩৩৪৪৫৫৬৬, ১০ জিবির ৩০ দিনের প্যাক লাগবে।"
